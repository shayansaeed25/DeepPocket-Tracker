name: DeepPocket Tracker News Watch

on:
  workflow_dispatch: {}   # Manual trigger only (news now runs bundled inside hourly scan.yml to save ~1,500 Actions mins/month)

permissions:
  contents: write

concurrency:
  group: deeppocket-tracker-news-${{ github.ref }}
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
        run: python src/news_monitor.py

      - name: Save seen-news state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in seen_news.txt recent_news.json quality_symbols_cache.json; do
            if [ -e "$f" ]; then git add -f "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update seen news state [skip ci]"
            for attempt in 1 2 3 4 5; do
              git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
              echo "push attempt $attempt failed, retrying..."; sleep $((attempt * 3))
            done
          fi
